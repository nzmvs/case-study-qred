# Schemathesis: generated requests against the real Card API, every response checked against its contract.
[checks]
# ADR 0002: a missing If-Match is 428 Precondition Required (RFC 6585), documented in the contract.
missing_required_header.expected-statuses = ["400", "428"]

# Seeded ids, so generated requests reach the domain logic instead of stopping at 404.
[parameters]
cardId = "00000000-0000-4000-a000-000000000201"
companyId = "00000000-0000-4000-a000-000000000101"

[[operations]]
include-name = "POST /cards/{cardId}/transactions"
# A currency other than the Card's, or a purchase over the Remaining spend, is a documented 422.
checks = { positive_data_acceptance = { expected-statuses = ["201", "404", "409", "422"] } }

# Rules OpenAPI cannot express, stated in the contract: a reversed range, and a cursor this API did not issue.
[[operations]]
include-name = "GET /cards/{cardId}/spend"
checks = { positive_data_acceptance = { expected-statuses = ["200", "400", "404"] } }

[[operations]]
include-name = "GET /cards/{cardId}/transactions"
checks = { positive_data_acceptance = { expected-statuses = ["200", "400", "404"] } }

# Changing a Card is stateful: an ETag not from the latest read is 412, a transition the current status
# does not allow is 409, and a closed Card's closedReason cannot change (422).
[[operations]]
include-name = "PUT /cards/{cardId}"
checks = { positive_data_acceptance = { expected-statuses = ["200", "404", "409", "412", "422"] } }

# Mocked authentication (ADR 0003): bearer token -> demo principal, shared by every service.
x-principals: &principals >-
  {"anna": {"kind": "user", "userId": "00000000-0000-4000-a000-000000000001",
            "memberships": ["00000000-0000-4000-a000-000000000101", "00000000-0000-4000-a000-000000000102"]},
   "card-processor": {"kind": "client", "clientId": "card-processor", "scopes": ["transactions:write"]}}

x-app: &app
  restart: unless-stopped

x-mock: &mock
  build: ./infra/prism
  profiles: [mock]
  restart: unless-stopped
  volumes:
    - ./contracts:/contracts:ro

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  identity-api:
    <<: *app
    build: { context: ., target: dev, args: { APP: identity-api } }
    environment:
      PORT: 3001
      DATABASE_URL: postgres://identity:identity@postgres:5432/identity
      AUTH_PRINCIPALS: *principals
    ports: ["3001:3001"]
    develop:
      watch:
        - { action: sync, path: ./apps/identity-api/src, target: /repo/apps/identity-api/src }
        - { action: sync, path: ./packages/service-kit/src, target: /repo/packages/service-kit/src }
        - { action: sync+restart, path: ./contracts, target: /repo/contracts }
        - { action: rebuild, path: ./apps/identity-api/package.json }
    depends_on: { postgres: { condition: service_healthy } }

  card-api:
    <<: *app
    build: { context: ., target: dev, args: { APP: card-api } }
    environment:
      PORT: 3002
      DATABASE_URL: postgres://card:card@postgres:5432/card
      AUTH_PRINCIPALS: *principals
    ports: ["3002:3002"]
    develop:
      watch:
        - { action: sync, path: ./apps/card-api/src, target: /repo/apps/card-api/src }
        - { action: sync, path: ./apps/card-api/test, target: /repo/apps/card-api/test }
        - { action: sync, path: ./packages/service-kit/src, target: /repo/packages/service-kit/src }
        - { action: sync+restart, path: ./contracts, target: /repo/contracts }
        - { action: rebuild, path: ./apps/card-api/package.json }
    depends_on: { postgres: { condition: service_healthy } }

  billing-api:
    <<: *app
    build: { context: ., target: dev, args: { APP: billing-api } }
    environment:
      PORT: 3003
      DATABASE_URL: postgres://billing:billing@postgres:5432/billing
    ports: ["3003:3003"]
    develop:
      watch:
        - { action: sync, path: ./apps/billing-api/src, target: /repo/apps/billing-api/src }
        - { action: rebuild, path: ./apps/billing-api/package.json }
    depends_on: { postgres: { condition: service_healthy } }

  app-bff:
    <<: *app
    build: { context: ., target: dev, args: { APP: app-bff } }
    environment:
      PORT: 3000
      IDENTITY_API_URL: http://identity-api:3001
      CARD_API_URL: http://card-api:3002
      BILLING_API_URL: http://billing-api:3003
    ports: ["3000:3000"]
    develop:
      watch:
        - { action: sync, path: ./apps/app-bff/src, target: /repo/apps/app-bff/src }
        - { action: rebuild, path: ./apps/app-bff/package.json }
    depends_on: [identity-api, card-api, billing-api]

  mock-app-bff:
    <<: *mock
    command: ["/contracts/app-bff.yaml"]
    ports: ["4000:4010"]

  mock-identity-api:
    <<: *mock
    command: ["/contracts/identity-api.yaml"]
    ports: ["4001:4010"]

  mock-card-api:
    <<: *mock
    command: ["/contracts/card-api.yaml"]
    ports: ["4002:4010"]

  mock-billing-api:
    <<: *mock
    command: ["/contracts/billing-api.yaml"]
    ports: ["4003:4010"]

volumes:
  pgdata:

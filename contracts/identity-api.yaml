openapi: 3.1.0
info:
  title: Identity API
  version: 0.1.0
  description: |
    Owns Users, Companies and Memberships. The signed-in User is a fixed
    demo User injected by middleware (ADR 0006).

    Every path answers undeclared methods with `405 Method Not Allowed` and an
    `Allow` header, and rejects unknown query parameters with `400`.
servers:
  - url: http://localhost:3001
    description: Local (docker compose)
# No authentication: every request acts as the fixed demo User (ADR 0006).
security: []

paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in User and the Companies they are a member of
      responses:
        "200":
          description: The User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

components:
  schemas:
    Id:
      type: string
      format: uuid

    Me:
      type: object
      required: [id, name, companies]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        companies:
          type: array
          description: Sorted by name.
          items: { $ref: "#/components/schemas/Company" }
      example:
        id: 00000000-0000-4000-a000-000000000001
        name: Anna Lindqvist
        companies:
          - id: 00000000-0000-4000-a000-000000000101
            name: Company AB
          - id: 00000000-0000-4000-a000-000000000102
            name: Nordic Trading AB

    Company:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }

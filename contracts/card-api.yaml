openapi: 3.1.0
info:
  title: Card API
  version: 0.1.0
  description: |
    Owns Cards and Transactions and their lifecycles. Depends on no other
    service at runtime. A User only reaches their own Cards; the User is a
    fixed demo User injected by middleware (ADR 0006).

    All money is in minor units (öre) with an ISO 4217 currency. Errors use
    `application/problem+json` (RFC 9457). Resources that are not visible to
    the User answer `404`.
    Every path answers undeclared methods with `405 Method Not Allowed` and an
    `Allow` header, and rejects unknown query parameters with `400`.
servers:
  - url: http://localhost:3002
    description: Local (docker compose)
# No authentication: every request acts as the fixed demo User (ADR 0006).
security: []

paths:
  /cards:
    get:
      operationId: listCards
      summary: Find the caller's Cards in a Company
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - name: holder
          in: query
          required: true
          description: Only the User's own Cards can be listed.
          schema: { type: string, enum: [me] }
        - name: status
          in: query
          required: false
          description: Comma-separated Card statuses to include; all when omitted.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 5
            uniqueItems: true
            items: { $ref: "#/components/schemas/CardStatus" }
      responses:
        "200":
          description: Matching Cards
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Card" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /cards/{cardId}:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      operationId: getCard
      summary: A Card
      responses:
        "200":
          description: The Card
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putCard
      summary: Replace a Card's mutable state
      description: |
        Carries the full mutable representation of the Card (ADR 0002). A
        changed `status` must be the `status` of one of the Card's
        `allowedTransitions`. The `ETag` is a hash of the Card's
        representation. A PUT that changes nothing writes nothing and returns
        the same `ETag`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
            example:
              settings: { spendingLimit: 2500000 }
              state: { status: active, closedReason: null }
      responses:
        "200":
          description: The updated Card
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IllegalTransition" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /cards/{cardId}/spend:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      operationId: getCardSpend
      summary: Remaining spend in the current Spend period
      description: |
        The Card's Spending limit, what it spent in the current Spend period
        (the UTC calendar month, ADR 0005) and its Remaining spend. Pending
        and settled Transactions count; reversed ones do not.
      responses:
        "200":
          description: The spend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spend" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cards/{cardId}/transactions:
    parameters:
      - $ref: "#/components/parameters/CardId"
    get:
      operationId: listCardTransactions
      summary: A Card's Transactions, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque; `nextCursor` from the previous page. Any other value is `400`.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: A page of Transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCardTransaction
      summary: Record a Transaction authorised on a Card
      description: |
        Called by the card processor when a purchase is authorised. The
        Transaction starts `pending`. Rejected when the Card is not `active`
        or the amount exceeds the Card's Remaining spend in the Spend period
        (the UTC calendar month, ADR 0005) that contains `occurredAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
            example:
              amount: { amount: 12900, currency: SEK }
              merchantName: Pressbyrån
              occurredAt: "2026-09-29T09:12:00+02:00"
      responses:
        "201":
          description: The recorded Transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CardNotActive" }
        "422": { $ref: "#/components/responses/Unprocessable" }

components:
  parameters:
    CardId:
      name: cardId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The Card's current `ETag`. `*` is refused like any other stale
        value (`412`), since it would skip the check that prevents lost
        updates. The server answers `428` when it is missing; the contract
        mock answers `422` instead.
      schema: { type: string }

  headers:
    ETag:
      description: Version of the Card; send as `If-Match` to change it.
      schema: { type: string }
      example: '"Yp3kR9x2Qa7LmW0e"'

  schemas:
    Id:
      type: string
      format: uuid

    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: integer
          description: Minor units (öre for SEK).
        currency:
          type: string
          pattern: "^[A-Z]{3}$"

    CardStatus:
      type: string
      enum: [inactive, active, frozen, closed, expired]

    ClosedReason:
      type: string
      enum: [lost, stolen, cancelled]

    CardTransition:
      type: string
      enum: [activate, freeze, unfreeze, close]

    Card:
      type: object
      required: [id, createdAt, updatedAt, details, settings, state]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: Last change to settings or state; unchanged by a PUT that changes nothing.
        details: { $ref: "#/components/schemas/CardDetails" }
        settings: { $ref: "#/components/schemas/CardSettings" }
        state: { $ref: "#/components/schemas/CardState" }
      example:
        id: 00000000-0000-4000-a000-000000000201
        createdAt: "2026-01-12T10:00:00+01:00"
        updatedAt: "2026-01-14T08:30:00+01:00"
        details:
          companyId: 00000000-0000-4000-a000-000000000101
          holderUserId: 00000000-0000-4000-a000-000000000001
          last4: "4821"
          expiry: { month: 9, year: 2029 }
          currency: SEK
        settings:
          spendingLimit: 1000000
        state:
          status: active
          closedReason: null
          allowedTransitions:
            - { transition: freeze, status: frozen }
            - { transition: close, status: closed }

    CardDetails:
      type: object
      description: Fixed when the Card is issued; never changes.
      required: [companyId, holderUserId, last4, expiry, currency]
      properties:
        companyId:
          $ref: "#/components/schemas/Id"
          description: Reference to a Company in the Identity API.
        holderUserId:
          $ref: "#/components/schemas/Id"
          description: Reference to the Cardholder, a User in the Identity API.
        last4:
          type: string
          pattern: "^[0-9]{4}$"
          description: Last four digits of the card number.
        expiry:
          type: object
          required: [month, year]
          properties:
            month: { type: integer, minimum: 1, maximum: 12 }
            year: { type: integer, minimum: 2000 }
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: The only currency the Card spends and is limited in.

    CardSettings:
      type: object
      description: Editable at any time; no lifecycle rules.
      required: [spendingLimit]
      additionalProperties: false
      properties:
        spendingLimit:
          type: integer
          minimum: 0
          description: Maximum spend per Spend period, in minor units of `details.currency`.

    CardState:
      type: object
      description: Changes only through the Card's state machine.
      required: [status, closedReason, allowedTransitions]
      properties:
        status: { $ref: "#/components/schemas/CardStatus" }
        closedReason:
          oneOf:
            - $ref: "#/components/schemas/ClosedReason"
            - type: "null"
        allowedTransitions:
          type: array
          description: Status changes allowed from the current status.
          items: { $ref: "#/components/schemas/AllowedTransition" }

    AllowedTransition:
      type: object
      required: [transition, status]
      properties:
        transition: { $ref: "#/components/schemas/CardTransition" }
        status:
          $ref: "#/components/schemas/CardStatus"
          description: The `status` a PUT sends to make this transition.

    CardInput:
      type: object
      description: |
        The mutable part of a Card: `settings` and `state` without the derived
        `allowedTransitions`. `details` cannot be sent.
      required: [settings, state]
      additionalProperties: false
      properties:
        settings: { $ref: "#/components/schemas/CardSettings" }
        state:
          type: object
          description: |
            A changed `status` must be the `status` of one of
            `allowedTransitions` (`409` otherwise). `closedReason` is given
            exactly when `status` is `closed`, and a closed Card keeps its
            reason (`422`).
          required: [status, closedReason]
          additionalProperties: false
          properties:
            status: { $ref: "#/components/schemas/CardStatus" }
            closedReason:
              oneOf:
                - $ref: "#/components/schemas/ClosedReason"
                - type: "null"
          if:
            properties: { status: { const: closed } }
          then:
            properties: { closedReason: { $ref: "#/components/schemas/ClosedReason" } }
          else:
            properties: { closedReason: { type: "null" } }

    Spend:
      type: object
      required: [periodStart, periodEnd, spendingLimit, spent, remaining]
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd:
          type: string
          format: date-time
          description: Exclusive.
        spendingLimit: { $ref: "#/components/schemas/Money" }
        spent:
          $ref: "#/components/schemas/Money"
          description: Pending and settled Transactions in the Spend period.
        remaining:
          $ref: "#/components/schemas/Money"
          description: The Spending limit minus `spent`, never below zero.
      example:
        periodStart: "2026-09-01T00:00:00Z"
        periodEnd: "2026-10-01T00:00:00Z"
        spendingLimit: { amount: 1000000, currency: SEK }
        spent: { amount: 460000, currency: SEK }
        remaining: { amount: 540000, currency: SEK }

    TransactionStatus:
      type: string
      enum: [pending, settled, reversed]

    Transaction:
      type: object
      required: [id, cardId, amount, merchantName, occurredAt, status]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        cardId: { $ref: "#/components/schemas/Id" }
        amount: { $ref: "#/components/schemas/Money" }
        merchantName: { type: string }
        occurredAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/TransactionStatus" }
      example:
        id: 00000000-0000-4000-a000-000000001057
        cardId: 00000000-0000-4000-a000-000000000201
        amount: { amount: 89500, currency: SEK }
        merchantName: SJ AB
        occurredAt: "2026-09-28T16:42:00+02:00"
        status: pending

    TransactionInput:
      type: object
      required: [amount, merchantName, occurredAt]
      additionalProperties: false
      properties:
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
            - properties:
                amount: { type: integer, minimum: 1 }
          description: Positive; currency must equal the Card's `details.currency`.
        merchantName:
          type: string
          minLength: 1
          maxLength: 200
          description: Printable text; control characters are rejected.
          pattern: "^[^\\x00-\\x1F\\x7F]+$"
        occurredAt: { type: string, format: date-time }

    TransactionPage:
      type: object
      required: [items, totalCount, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        totalCount:
          type: integer
          minimum: 0
          description: All Transactions on the Card.
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
      example:
        items:
          - id: 00000000-0000-4000-a000-000000001057
            cardId: 00000000-0000-4000-a000-000000000201
            amount: { amount: 89500, currency: SEK }
            merchantName: SJ AB
            occurredAt: "2026-09-28T14:42:00Z"
            status: pending
          - id: 00000000-0000-4000-a000-000000001056
            cardId: 00000000-0000-4000-a000-000000000201
            amount: { amount: 34900, currency: SEK }
            merchantName: Clas Ohlson
            occurredAt: "2026-09-27T09:05:00Z"
            status: settled
          - id: 00000000-0000-4000-a000-000000001055
            cardId: 00000000-0000-4000-a000-000000000201
            amount: { amount: 6400, currency: SEK }
            merchantName: Espresso House
            occurredAt: "2026-09-27T06:17:00Z"
            status: settled
        totalCount: 57
        nextCursor: WyIyMDI2LTA5LTI3VDA2OjE3OjAwWiIsIjAwMDAwMDAwLTAwMDAtNDAwMC1hMDAwLTAwMDAwMDAwMTA1NSJd

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        allowedTransitions:
          type: array
          description: Present on an illegal transition.
          items: { $ref: "#/components/schemas/AllowedTransition" }

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: The Card does not exist or is not the User's.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IllegalTransition:
      description: The status change is not allowed from the Card's current status.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://api.qred.example/problems/illegal-transition
            title: Illegal card status transition
            status: 409
            detail: A closed card cannot be activated.
            allowedTransitions: []
    CardNotActive:
      description: The Card is not active and cannot be charged.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: The Card changed since its `ETag` was read.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: "`If-Match` is missing."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: |
        Well-formed but breaks a domain rule: changing a closed Card's
        `closedReason`, a currency other than the Card's, or a Transaction
        over the Remaining spend.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
